version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - funlen
    - gocognit
    - gocyclo
    - misspell
    - nestif
    - noctx
    - revive
    - sloglint
  settings:
    funlen:
      lines: 30
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 16
    gocyclo:
      min-complexity: 11
  exclusions:
    generated: strict
    paths:
      - internal/adapters/httpapi/generated

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
    paths:
      - internal/adapters/httpapi/generated
