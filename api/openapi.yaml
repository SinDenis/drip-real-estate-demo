openapi: 3.0.3
info:
  title: DRIP Недвижимость API
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Start a server-side session with local credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      summary: Replace a temporary password and activate the account
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password changed and account activated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current server-side session
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Current session revoked
          headers:
            Set-Cookie:
              schema: { type: string }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Return the current authenticated employee
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Current employee returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/sessions:
    post:
      operationId: createAnalyticalSession
      summary: Create one immutable current-only analytical session
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAnalyticalSessionRequest" }
      responses:
        "201":
          description: A new session was created, or the same request was replayed
          headers:
            Location:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticalSessionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    get:
      operationId: listAnalyticalSessions
      summary: List shared non-deleted analytical sessions
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Shared analytical sessions returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticalSessionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getAnalyticalSession
      summary: Return one shared non-deleted analytical session
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Analytical session returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticalSessionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/sessions/{sessionId}/collect:
    post:
      operationId: collectCurrentSnapshot
      summary: Advance one current-only ЕИСЖС collection request
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session advanced by at most one ЕИСЖС business request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticalSessionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/catalog/regions:
    get:
      operationId: listRegions
      summary: Return the versioned selectable Russian region catalog
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Versioned regions returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/catalog/segments:
    get:
      operationId: listSegments
      summary: Return stable real-estate segments and current ЕИСЖС support
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Stable segments returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/catalog/regions/{regionCode}/complexes:
    get:
      operationId: listResidentialComplexes
      summary: Return the cached residential complexes for one selected region
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/RegionCode"
      responses:
        "200":
          description: Fresh or explicitly stale residential complex catalog returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentialComplexCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: ЕИСЖС is unavailable and no cached catalog exists
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/employees:
    get:
      operationId: listEmployees
      summary: List local employee accounts
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Employee accounts returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    post:
      operationId: createEmployee
      summary: Create a local employee account and issue a temporary password
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEmployeeRequest" }
      responses:
        "201":
          description: Employee account created
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryCredential" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/employees/{employeeId}:
    patch:
      operationId: updateEmployee
      summary: Change an employee display name or role
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEmployeeRequest" }
      responses:
        "200":
          description: Employee account updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/employees/{employeeId}/deactivate:
    post:
      operationId: deactivateEmployee
      summary: Deactivate an employee and revoke all server-side sessions
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee account deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/employees/{employeeId}/restore:
    post:
      operationId: restoreEmployee
      summary: Restore an employee by issuing a new temporary password
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee account restored pending activation
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryCredential" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/employees/{employeeId}/reset-password:
    post:
      operationId: resetEmployeePassword
      summary: Issue a replacement temporary password and revoke all sessions
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Replacement temporary password issued
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryCredential" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /api/v1/employees/{employeeId}/revoke-sessions:
    post:
      operationId: revokeEmployeeSessions
      summary: Revoke every server-side session for an employee
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "204": { description: Employee sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the API process is alive
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether required dependencies are available
      responses:
        "200":
          description: Required dependencies are available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: At least one required dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
components:
  parameters:
    SessionCookie:
      in: cookie
      name: ad_session
      required: false
      schema: { type: string }
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      in: path
      name: employeeId
      required: true
      schema: { type: string, format: uuid }
    RegionCode:
      in: path
      name: regionCode
      required: true
      schema: { type: string, pattern: "^[0-9]{2}$" }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[ -~]+$'
  responses:
    Unauthorized:
      description: Authentication is required or credentials are invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The current employee is not allowed to perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The requested resource is unavailable or hidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The requested change conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Login attempts are temporarily limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnexpectedError:
      description: Unexpected API error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    AccountState:
      type: string
      enum: [pending_activation, active, deactivated]
    Role:
      type: string
      enum: [employee, analytics_admin]
    AnalyticalSessionStatus:
      type: string
      enum: [queued, collecting, complete, partial, failed, canceled]
    Region:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: "^[0-9]{2}$" }
        name: { type: string }
    RegionCatalog:
      type: object
      required: [version, source, items]
      properties:
        version: { type: string }
        source: { type: string, format: uri }
        items:
          type: array
          minItems: 89
          maxItems: 89
          items: { $ref: "#/components/schemas/Region" }
    SegmentCode:
      type: string
      enum:
        [
          residential,
          apartments,
          non_residential,
          storage,
          parking,
          industrial_warehouse,
        ]
    Segment:
      type: object
      required: [code, name, eiszhsSupported]
      properties:
        code: { $ref: "#/components/schemas/SegmentCode" }
        name: { type: string }
        eiszhsSupported: { type: boolean }
        eiszhsCategory: { type: string, enum: [living, nonliving, parking] }
    SegmentCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: "#/components/schemas/Segment" }
    ResidentialComplex:
      type: object
      required: [complexId, name]
      properties:
        complexId: { type: string }
        name: { type: string }
    ResidentialComplexCatalog:
      type: object
      required: [freshness, observedAt, expiresAt, items]
      properties:
        freshness: { type: string, enum: [fresh, stale] }
        observedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        warning: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ResidentialComplex" }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, login, displayName, role, state, requiresPasswordChange]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        state: { $ref: "#/components/schemas/AccountState" }
        requiresPasswordChange: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128 }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 15, maxLength: 128 }
    EmployeeSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    AnalyticalSessionSummary:
      type: object
      additionalProperties: false
      required: [id, name, subtitle, status, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subtitle: { type: string }
        status: { $ref: "#/components/schemas/AnalyticalSessionStatus" }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/EmployeeSummary" }
    AnalyticalSessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AnalyticalSessionSummary" }
        nextCursor: { type: string }
    AnalyticalPeriod:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    AnalyticalSessionFilters:
      type: object
      additionalProperties: false
      required: [regions, residentialComplexes, segments]
      properties:
        regionCodes:
          type: array
          uniqueItems: true
          items: { type: string, pattern: "^[0-9]{2}$" }
        residentialComplexIds:
          type: array
          uniqueItems: true
          items: { type: string }
        segmentCodes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/SegmentCode" }
        regions:
          type: array
          minItems: 1
          items: { type: string }
        residentialComplexes:
          type: array
          minItems: 1
          items: { type: string }
        segments:
          type: array
          minItems: 1
          items: { type: string }
        period: { $ref: "#/components/schemas/AnalyticalPeriod" }
    ObservationWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    CollectionProgress:
      type: object
      additionalProperties: false
      required: [phase, completedRequests, discoveredTotal, cached, fetched, failed]
      properties:
        phase:
          type: string
          enum: [discovering_objects, collecting_objects, complete]
        completedRequests: { type: integer, minimum: 0 }
        totalRequests:
          type: integer
          minimum: 0
          description: Exact total after authoritative membership planning; absent while planning.
        discoveredTotal: { type: integer, minimum: 0 }
        cached: { type: integer, minimum: 0 }
        fetched: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        remaining:
          type: integer
          minimum: 0
          description: Exact remaining request count; absent while membership planning is incomplete.
        currentComplexId: { type: string }
        currentObjectId: { type: string }
        nextActionAt: { type: string, format: date-time }
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Monotonic exact request percentage; absent while membership planning is incomplete.
    CurrentEISZHSDashboard:
      type: object
      additionalProperties: false
      required: [sourceLabel]
      properties:
        sourceLabel: { type: string, enum: ["Текущий срез ЕИСЖС"] }
        cumulativeDduCount:
          type: integer
          format: int64
          minimum: 0
          description: Absent when the pinned observation has no published cumulative DDU value.
    AnalyticalSessionDetail:
      type: object
      additionalProperties: false
      required: [id, name, subtitle, status, createdAt, createdBy, filters]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subtitle: { type: string }
        status: { $ref: "#/components/schemas/AnalyticalSessionStatus" }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/EmployeeSummary" }
        filters: { $ref: "#/components/schemas/AnalyticalSessionFilters" }
        observedWindow: { $ref: "#/components/schemas/ObservationWindow" }
        collectionProgress: { $ref: "#/components/schemas/CollectionProgress" }
        currentEiszhsDashboard: { $ref: "#/components/schemas/CurrentEISZHSDashboard" }
    CreateAnalyticalSessionRequest:
      type: object
      additionalProperties: false
      required: [regionCodes, residentialComplexIds, segmentCodes]
      properties:
        regionCodes:
          type: array
          minItems: 1
          maxItems: 89
          uniqueItems: true
          items: { type: string, pattern: "^[0-9]{2}$" }
        residentialComplexIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 128 }
        segmentCodes:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { $ref: "#/components/schemas/SegmentCode" }
    Employee:
      type: object
      additionalProperties: false
      required: [id, login, displayName, role, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        state: { $ref: "#/components/schemas/AccountState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmployeePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Employee" }
    CreateEmployeeRequest:
      type: object
      additionalProperties: false
      required: [login, displayName, role]
      properties:
        login: { type: string, minLength: 3, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }
    UpdateEmployeeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }
    TemporaryCredential:
      type: object
      additionalProperties: false
      required: [employee, temporaryPassword, expiresAt]
      properties:
        employee: { $ref: "#/components/schemas/Employee" }
        temporaryPassword: { type: string, minLength: 20 }
        expiresAt: { type: string, format: date-time }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready, not_ready]
